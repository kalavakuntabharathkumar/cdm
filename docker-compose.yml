services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_only
      MYSQL_DATABASE: credit
      MYSQL_USER: credit
      MYSQL_PASSWORD: credit_dev_only
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_only"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    ports: ["8080:8080"]
    depends_on: [application-service, decision-service]
    environment:
      APPLICATION_URL: http://application-service:8081
      DECISION_URL: http://decision-service:8084
  application-service:
    build:
      context: .
      dockerfile: ./application-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: [kafka]
  risk-service:
    build:
      context: .
      dockerfile: ./risk-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: [kafka]
  decision-service:
    build:
      context: .
      dockerfile: ./decision-service/Dockerfile
    ports: ["8084:8084"]
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/credit?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: credit
      SPRING_DATASOURCE_PASSWORD: credit_dev_only
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
  notification-service:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: [kafka]
